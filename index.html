// ─── STATE ────────────────────────────────────────────────────────────────────
let state = { players:{}, matches:{}, tips:{} };
let currentUser  = null;
let isAdmin      = false;
let listenerOn   = false;
const ADMIN_PASS = "vm2026";

// ─── FIREBASE ─────────────────────────────────────────────────────────────────
function startListeners() {
  if (listenerOn) return;
  listenerOn = true;
  onValue(ref(db, "/"), snap => {
    const data    = snap.val() || {};
    state.players = data.players || {};
    state.matches = data.matches || {};
    state.tips    = data.tips    || {};
    if (Object.keys(state.matches).length === 0) {
      DEFAULT_MATCHES.forEach(m => set(ref(db, "matches/" + m.id), { ...m, score: null }));
    }
    renderAll();
  });
}

// ─── AUTH ─────────────────────────────────────────────────────────────────────
window.doLogin = async function() {
  const name = document.getElementById("login-name").value.trim();
  const pass  = document.getElementById("login-pass").value;
  if (!name) { toast("Ange ett smeknamn!"); return; }
  if (/[.#$[\]/]/.test(name)) { toast("Smeknamnet får ej innehålla . # $ [ ] /"); return; }
  isAdmin     = (pass === ADMIN_PASS);
  currentUser = name;
  try {
    await set(ref(db, "players/" + san(name)), { name });
  } catch(e) {
    toast("Databasfel – kontrollera Firebase-regler."); currentUser = null; return;
  }
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").style.display   = "";
  document.getElementById("uname-display").textContent  = name;
  document.getElementById("av").textContent = name[0].toUpperCase();
  document.getElementById("admin-tab").style.display    = isAdmin ? "" : "none";
  startListeners();
}

window.doLogout = function() {
  currentUser = null; isAdmin = false; listenerOn = false;
  document.getElementById("login-screen").style.display = "";
  document.getElementById("app-screen").style.display   = "none";
  document.getElementById("login-pass").value = "";
  document.getElementById("login-name").value = "";
  document.getElementById("admin-tab").style.display = "none";
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
window.switchTab = function(name, el) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("panel-" + name).classList.add("active");
}

// ─── SCORING ─────────────────────────────────────────────────────────────────
function outcome(score) {
  if (!score) return null;
  return score.home > score.away ? "1" : score.home < score.away ? "2" : "X";
}
function getTip(name, mid) { return (state.tips[san(name)] || {})[mid] || null; }

window.setTip = function(mid, o) {
  const k = san(currentUser), cur = getTip(currentUser, mid);
  if (cur && cur.outcome === o) remove(ref(db, `tips/${k}/${mid}`));
  else set(ref(db, `tips/${k}/${mid}`), { outcome:o, home:null, away:null });
}

window.setScoreTip = function(mid, hv, av) {
  const h = parseInt(hv), a = parseInt(av);
  if (isNaN(h)||isNaN(a)||h<0||a<0) { toast("Ogiltigt resultat"); return; }
  set(ref(db, `tips/${san(currentUser)}/${mid}`), { outcome: h>a?"1":h<a?"2":"X", home:h, away:a });
  toast("Tipp sparad! ✓");
}

function pts(name) {
  let p=0, c=0, e=0;
  for (const m of Object.values(state.matches)) {
    if (!m.score) continue;
    const t = getTip(name, m.id); if (!t) continue;
    const ro = outcome(m.score);
    if (t.outcome === ro) {
      p++; c++;
      if (t.home!=null && t.away!=null &&
          Number(t.home)===Number(m.score.home) &&
          Number(t.away)===Number(m.score.away)) { p+=2; e++; }
    }
  }
  return {p,c,e};
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function renderAll() { renderBoard(); renderMatches(); if (isAdmin) renderAdmin(); }

function renderBoard() {
  const rows = Object.values(state.players)
    .map(pl => ({ name:pl.name, ...pts(pl.name) }))
    .sort((a,b) => b.p-a.p || b.c-a.c || b.e-a.e);
  const el = document.getElementById("board-rows");
  if (!rows.length) { el.innerHTML='<div class="loading">Inga spelare ännu</div>'; return; }
  el.innerHTML = rows.map((r,i) => {
    const m = i===0?"r1":i===1?"r2":i===2?"r3":"";
    return `<div class="board-row${r.name===currentUser?" me":""}">
      <div class="rank ${m}">${i+1}</div>
      <div class="board-name">${esc(r.name)}${r.name===currentUser?' <span style="font-size:.75rem;color:var(--muted)">(du)</span>':''}</div>
      <div class="board-pts">${r.p}</div>
      <div class="board-stat h-x">${r.c}</div>
      <div class="board-stat h-x">${r.e}</div>
    </div>`;
  }).join("");
}

function renderMatches() {
  const matches = Object.values(state.matches);
  const groups  = {};
  for (const m of matches) { if (!groups[m.group]) groups[m.group]=[]; groups[m.group].push(m); }
  const el = document.getElementById("matches-list");
  let html = "";
  for (const g of Object.keys(groups).sort()) {
    html += `<div class="match-group"><div class="mgt">${esc(g)}</div>`;
    for (const m of groups[g]) {
      const tip  = getTip(currentUser, m.id);
      const done = !!m.score;
      const ro   = outcome(m.score);
      const scoreHtml = done ? `<div class="match-score">${m.score.home}–${m.score.away}</div>` : "";

      let tipHtml = "";
      if (!done) {
        const hL = m.home.includes(" ") ? m.home.split(" ").slice(1).join(" ").substring(0,10) : m.home;
        const aL = m.away.includes(" ") ? m.away.split(" ").slice(1).join(" ").substring(0,10) : m.away;
        const btns = ["1","X","2"].map(o => {
          const lbl = o==="1"?hL:o==="2"?aL:"Oavgjort";
          return `<button class="tip-btn${tip?.outcome===o?" selected":""}" onclick="setTip('${m.id}','${o}')">${o}<br><span style="font-size:.7rem;font-weight:400">${esc(lbl)}</span></button>`;
        }).join("");
        tipHtml = `<div class="match-tips">${btns}</div>
          <div class="score-input">
            <input type="number" id="sh-${m.id}" min="0" max="20" placeholder="0" value="${tip?.home!=null?tip.home:''}">
            <span class="score-sep">–</span>
            <input type="number" id="sa-${m.id}" min="0" max="20" placeholder="0" value="${tip?.away!=null?tip.away:''}">
            <button class="btn-save-score" onclick="setScoreTip('${m.id}',document.getElementById('sh-${m.id}').value,document.getElementById('sa-${m.id}').value)">Tippa exakt</button>
          </div>`;
      } else {
        const btns = ["1","X","2"].map(o => {
          let cls = tip && o===tip.outcome ? (tip.outcome===ro?" correct":" wrong") : o===ro?" correct":"";
          const lbl = o==="1"?"Hem":o==="2"?"Bort":"Oavgjort";
          return `<button class="tip-btn${cls}" disabled>${o}<br><span style="font-size:.7rem;font-weight:400">${lbl}</span></button>`;
        }).join("");
        let badge = "";
        if (tip) {
          const got = tip.outcome===ro;
          const ex  = got && Number(tip.home)===Number(m.score.home) && Number(tip.away)===Number(m.score.away);
          const p2  = ex?3:got?1:0;
          badge = `<span class="tip-badge ${p2>0?'pts':'zero'}">${p2>0?'+'+p2+' p':'0 p'}</span>`;
          tipHtml = `<div class="match-tips">${btns}</div>
            <div style="margin-top:8px;font-size:.82rem;color:var(--muted)">
              Du tippade: <strong style="color:var(--text)">${tip.outcome}${tip.home!=null?` (${tip.home}–${tip.away})`:''}</strong> ${badge}
            </div>`;
        } else {
          tipHtml = `<div class="match-tips">${btns}</div>
            <div style="margin-top:8px;font-size:.82rem;color:var(--muted)">Du tippade inte denna match.</div>`;
        }
      }
      html += `<div class="match-card">
        <div class="match-top">
          <div class="match-date">${esc(m.date)}</div>
          <div class="match-teams"><span>${esc(m.home)}</span><span class="vs">vs</span><span>${esc(m.away)}</span></div>
          ${scoreHtml}
        </div>${tipHtml}</div>`;
    }
    html += "</div>";
  }
  if (!matches.length) html = `<div class="loading">Inga matcher.</div>`;
  el.innerHTML = html;
}

      <span class="admin-status ${done?'':'pending'}">${done?m.score.home+'–'+m.score.away:'Ej spelad'}</span>
      ${done
        ? `<button class="btn btn-sm btn-outline" onclick="clearScore('${m.id}')">Rensa</button>`
        : `<input type="number" id="rh-${m.id}" min="0" max="20" placeholder="Hem" style="width:58px;padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text)">
           <span style="color:var(--muted)">–</span>
           <input type="number" id="ra-${m.id}" min="0" max="20" placeholder="Bort" style="width:58px;padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text)">
           <button class="btn btn-sm btn-danger" onclick="saveScore('${m.id}')">Spara</button>`
      }
      <button class="btn btn-sm btn-outline" onclick="delMatch('${m.id}')" style="margin-left:auto;color:var(--accent2);border-color:var(--accent2)">🗑</button>
    </div>`;
  }).join("") || '<p style="color:var(--muted)">Inga matcher.</p>';

  document.getElementById("admin-players-list").innerHTML = Object.values(state.players).map(pl => {
    const s = pts(pl.name);
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      <span style="flex:1;font-weight:600">${esc(pl.name)}</span>
      <span style="color:var(--accent);font-family:'Bebas Neue',sans-serif;font-size:1.2rem">${s.p} p</span>
      <button class="btn btn-sm btn-outline" onclick="delPlayer('${san(pl.name)}')" style="color:var(--accent2);border-color:var(--accent2)">Ta bort</button>
    </div>`;
  }).join("") || '<p style="color:var(--muted)">Inga spelare.</p>';
}

window.addMatch = function() {
  const home  = document.getElementById("a-home").value.trim();
  const away  = document.getElementById("a-away").value.trim();
  const date  = document.getElementById("a-date").value.trim();
  const group = document.getElementById("a-group").value.trim();
  if (!home||!away) { toast("Fyll i båda lagen!"); return; }
  const id = "m"+Date.now();
  set(ref(db,"matches/"+id), {id,home,away,date:date||"TBD",group:group||"Övrigt",score:null});
  ["a-home","a-away","a-date","a-group"].forEach(x=>document.getElementById(x).value="");
  toast("Match tillagd ✓");
}
window.saveScore = function(id) {
  const h=parseInt(document.getElementById("rh-"+id)?.value);
  const a=parseInt(document.getElementById("ra-"+id)?.value);
  if (isNaN(h)||isNaN(a)) { toast("Ogiltigt!"); return; }
  set(ref(db,"matches/"+id+"/score"),{home:h,away:a}); toast("Resultat sparat ✓");
}
window.clearScore = id => set(ref(db,"matches/"+id+"/score"),null);
window.delMatch   = function(id){ if(!confirm("Ta bort matchen?")) return; remove(ref(db,"matches/"+id)); }
window.delPlayer  = function(key){ if(!confirm("Ta bort spelaren?")) return; remove(ref(db,"players/"+key)); remove(ref(db,"tips/"+key)); }

function san(s){ return String(s).replace(/[.#$[\]/\s]/g,"_"); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
let _tt;
window.toast = function(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(_tt); _tt=setTimeout(()=>el.classList.remove("show"),2600); }

document.getElementById("login-screen").style.display="";
</script>

<style>
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#2a2a3e;--accent:#e8ff3a;--accent2:#ff4d6d;--text:#f0f0f8;--muted:#6b6b8a;--gold:#ffd700;--silver:#c0c0d0;--bronze:#cd7f32}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 20%,rgba(232,255,58,.04) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 80% 80%,rgba(255,77,109,.04) 0%,transparent 60%);pointer-events:none;z-index:0}
.container{max-width:900px;margin:0 auto;padding:0 20px;position:relative;z-index:1}
header{padding:32px 0 20px;border-bottom:1px solid var(--border);margin-bottom:32px}
.header-inner{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(2.4rem,6vw,3.8rem);letter-spacing:2px;line-height:1}
.logo span{color:var(--accent)}
.logo small{display:block;font-family:'DM Sans',sans-serif;font-size:.65rem;letter-spacing:4px;text-transform:uppercase;color:var(--muted);font-weight:300;margin-top:2px}
.user-pill{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);border-radius:40px;padding:8px 16px 8px 10px;font-size:.85rem}
.user-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:1rem}
.btn-logout{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem;padding:0;margin-left:8px;transition:color .2s}
.btn-logout:hover{color:var(--accent2)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:28px}
.tab{flex:1;padding:10px;background:none;border:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.85rem;letter-spacing:1px;text-transform:uppercase;font-weight:600;cursor:pointer;border-radius:9px;transition:all .2s}
.tab.active{background:var(--accent);color:var(--bg)}
.tab:hover:not(.active){color:var(--text)}
.panel{display:none}.panel.active{display:block}
.login-wrap{max-width:400px;margin:60px auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px}
.login-wrap h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;margin-bottom:6px}
.login-wrap p{color:var(--muted);font-size:.88rem;margin-bottom:28px}
.field{margin-bottom:16px}
label{display:block;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
input[type=text],input[type=password],input[type=number]{width:100%;padding:12px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.95rem;transition:border-color .2s;outline:none}
input:focus{border-color:var(--accent)}
.btn{width:100%;padding:13px;background:var(--accent);color:var(--bg);border:none;border-radius:10px;font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:2px;cursor:pointer;transition:all .2s}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn-sm{padding:8px 18px;font-size:.9rem;border-radius:8px;width:auto;white-space:nowrap}
.btn-danger{background:var(--accent2);color:#fff;border:none}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.board{background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden}
.board-header{display:grid;grid-template-columns:48px 1fr 80px 80px 80px;padding:12px 20px;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
.board-row{display:grid;grid-template-columns:48px 1fr 80px 80px 80px;padding:16px 20px;border-bottom:1px solid var(--border);align-items:center;transition:background .15s}
.board-row:last-child{border-bottom:none}
.board-row:hover{background:var(--surface2)}
.board-row.me{background:rgba(232,255,58,.05)}
.rank{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--muted)}
.rank.r1{color:var(--gold)}.rank.r2{color:var(--silver)}.rank.r3{color:var(--bronze)}
.board-name{font-weight:600}
.board-pts{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--accent);text-align:right}
.board-stat{font-size:.85rem;color:var(--muted);text-align:right}
.match-group{margin-bottom:28px}
.mgt{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.mgt::after{content:'';flex:1;height:1px;background:var(--border)}
.match-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;margin-bottom:10px}
.match-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.match-date{font-size:.75rem;color:var(--muted);flex-shrink:0}
.match-teams{flex:1;display:flex;align-items:center;gap:10px;font-weight:600;font-size:1rem}
.vs{font-size:.75rem;color:var(--muted)}
.match-score{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;color:var(--accent);min-width:50px;text-align:right}
.match-tips{display:flex;gap:8px;flex-wrap:wrap}
.tip-btn{flex:1;min-width:60px;padding:8px 6px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}
.tip-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.tip-btn.selected{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tip-btn.correct{background:#1a3a1a;border-color:#4caf50;color:#4caf50}
.tip-btn.wrong{background:#3a1a1a;border-color:var(--accent2);color:var(--accent2)}
.tip-btn:disabled{cursor:default;opacity:.85}
.tip-badge{font-size:.75rem;padding:3px 10px;border-radius:20px;font-weight:600}
.tip-badge.pts{background:rgba(232,255,58,.1);color:var(--accent)}
.tip-badge.zero{background:rgba(255,77,109,.1);color:var(--accent2)}
.score-input{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
.score-input input{width:52px;text-align:center;padding:8px;font-size:1rem}
.score-sep{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--muted)}
.btn-save-score{padding:8px 16px;background:var(--accent2);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:opacity .2s}
.btn-save-score:hover{opacity:.85}
.admin-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.admin-section h3{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;margin-bottom:16px;color:var(--accent)}
.admin-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.admin-row:last-child{border-bottom:none}
.admin-label{flex:1;font-size:.9rem;min-width:140px}
.admin-status{font-size:.75rem;padding:3px 10px;border-radius:20px;background:rgba(232,255,58,.1);color:var(--accent);white-space:nowrap}
.admin-status.pending{background:rgba(107,107,138,.15);color:var(--muted)}
.add-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.add-form .full{grid-column:1/-1}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);color:var(--accent);padding:12px 24px;border-radius:40px;font-size:.88rem;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:.9rem}
@media(max-width:600px){
  .board-header,.board-row{grid-template-columns:36px 1fr 60px 60px}
  .board-header .h-x,.board-row .h-x{display:none}
  .add-form{grid-template-columns:1fr}
  .add-form .full{grid-column:1}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" style="display:none">
  <div class="container">
    <header><div class="logo">VM<span>-Tipset</span><small>USA · Canada · Mexico 2026</small></div></header>
    <div class="login-wrap">
      <h2>Logga in</h2>
      <p>Välj ett smeknamn. Alla delar samma poängtabell i realtid.</p>
      <div class="field">
        <label>Smeknamn</label>
        <input type="text" id="login-name" placeholder="t.ex. JaroGoal" maxlength="20"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="field">
        <label>Adminlösenord <span style="color:var(--muted);font-weight:300">(lämna tomt för spelare)</span></label>
        <input type="password" id="login-pass" placeholder="••••••"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn" onclick="doLogin()">Spela ⚽</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app-screen" style="display:none">
  <div class="container">
    <header>
      <div class="header-inner">
        <div class="logo">VM<span>-Tipset</span><small>USA · Canada · Mexico 2026</small></div>
        <div class="user-pill">
          <div class="user-avatar" id="av">J</div>
          <span id="uname-display"></span>
          <button class="btn-logout" onclick="doLogout()">Logga ut</button>
        </div>
      </div>
    </header>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('leaderboard',this)">🏆 Tabell</button>
      <button class="tab" onclick="switchTab('matches',this)">⚽ Matcher</button>
      <button class="tab" id="admin-tab" style="display:none" onclick="switchTab('admin',this)">⚙️ Admin</button>
    </div>

    <!-- TABELL -->
    <div class="panel active" id="panel-leaderboard">
      <div class="board">
        <div class="board-header">
          <div>#</div><div>Spelare</div>
          <div style="text-align:right">Poäng</div>
          <div style="text-align:right" class="h-x">Rätt</div>
          <div style="text-align:right" class="h-x">Exakt</div>
        </div>
        <div id="board-rows"><div class="loading">Laddar…</div></div>
      </div>
      <p style="margin-top:14px;font-size:.78rem;color:var(--muted)">Rätt 1X2 = 1 p &nbsp;·&nbsp; Rätt exakt resultat = 3 p (inkl. 1X2)</p>
    </div>

    <!-- MATCHER -->
    <div class="panel" id="panel-matches">
      <div id="matches-list"><div class="loading">Laddar…</div></div>
    </div>

    <!-- ADMIN -->
    <div class="panel" id="panel-admin">
      <div class="admin-section">
        <h3>Lägg till match</h3>
        <div class="add-form">
          <div class="field"><label>Hemmalag</label><input type="text" id="a-home" placeholder="🇸🇪 Sverige"></div>
          <div class="field"><label>Bortalag</label><input type="text" id="a-away" placeholder="🇧🇷 Brasilien"></div>
          <div class="field"><label>Datum (CET)</label><input type="text" id="a-date" placeholder="15 jun 21:00"></div>
          <div class="field"><label>Omgång / fas</label><input type="text" id="a-group" placeholder="Åttondelsfinaler"></div>
          <div class="full"><button class="btn" onclick="addMatch()">Lägg till match</button></div>
        </div>
      </div>
      <div class="admin-section"><h3>Ange resultat</h3><div id="admin-match-list"></div></div>
      <div class="admin-section"><h3>Spelare</h3><div id="admin-players-list"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>
